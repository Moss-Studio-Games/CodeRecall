[plugin]

name="CodeRecall"
description="I wrote this because searching my code manually took too long, with this plugin you can swiftly search, read and copy your local code from other projects without opening them.
Specify your project folder and view all your scripts in one place.
Copy part of the function -> Click Hold + Drag
Copy the entire function -> Click
Copy the entire script -> Shift + Click
Works for both .gd and .cs"
author="Somi"
version="1.2"
script="CodeRecall.gd"
