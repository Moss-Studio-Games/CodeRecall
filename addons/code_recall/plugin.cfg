[plugin]

name="CodeRecall"
description="I wrote this for myself because searching my code manually took too long.
With this plugin you can search, read and copy your code from your projects without opening them:
- Specify your project folder and view all your scripts in one place.
- Search your code via searchbar (you can customize highlight color)
- Copy part of the function -> Click Hold + Drag
- Copy the entire function -> Click
- Copy the entire script -> Shift + Click
Works for both .gd and .cs"
author="Somi"
version="1.2.3"
script="CodeRecall.gd"
